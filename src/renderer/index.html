<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 'unsafe-inline' 스크립트는 개발 모드에서 React 플러그인이 넣는 인라인 스크립트 때문. 외부 출처는 전부 막는다 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws:; object-src 'none'; base-uri 'none'"
    />
    <title>agent-desk</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
